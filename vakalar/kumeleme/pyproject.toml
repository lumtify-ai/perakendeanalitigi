[project]
name = "kumeleme"
version = "0.1.0"
description = "Magaza kumeleme vakasi (v4): kural tabanli gruplar (bolge, ciro sinifi, konum) ve makine ogrenmesi kumeleri"
requires-python = ">=3.11"
# Kaynak baglantisi ve temiz gorunumler ortak pakette (vakalar/ortak/pyproject.toml);
# kurulum: pip install -e ../ortak, sonra --no-deps -e ../../veri, sonra -e ".[dev]" (README).
# Kutuphane surumleri Ilk Sevkiyat ile ayni bantta (allocation/pyproject.toml): kumeleme paketi
# allocation .venv'ine --no-deps kurulur, orada hicbir surum degismemeli.
dependencies = ["perakende-analitik", "duckdb>=1.0", "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.3,<1.8",
                "threadpoolctl>=3.1"]   # ogren: KMeans tek is parcacigiyla (sklearn bagimliligi; kurulu 3.7.0)

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["kumeleme*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["veri: gercek v4 verisi gerektirir (yavas)"]
# numpy 2.5 + pandas 2.3: Timedelta icinde "generic unit" uyarisi (bizim degil)
filterwarnings = ["ignore:.*generic.*unit:DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
