[project]
name = "perakende-analitik"
version = "0.1.0"
description = "Yok satma vakasi: stoksuzluk kayip satisi kestiricileri icin ortak paket (v4 verisi)"
requires-python = ">=3.11"
# Windows sinirlari vakalar/rpt/pyproject.toml ile ayni gerekce:
# lightgbm ust siniri replenishment vakasindaki Windows cokmesi yuzunden;
# scikit-learn <1.8: lightgbm 4.5 check_X_y(force_all_finite=...) cagiriyor.
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "scikit-learn>=1.3,<1.8",
    "lightgbm>=4.3,<4.6",
]

[project.optional-dependencies]
# Hakem (gizli gercek) icin perakende-veri PyPI'da yok: README'deki gibi yolla kurulur
# (pip install -e ../../veri); kestiriciler onu almaz.
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["perakende_analitik*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["veri: gercek v4 verisi gerektirir (yavas)"]
filterwarnings = ["ignore:.*generic.*unit:DeprecationWarning", "ignore:.*force_all_finite:FutureWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
