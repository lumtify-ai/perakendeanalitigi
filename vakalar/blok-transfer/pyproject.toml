[project]
name = "blok-transfer"
version = "0.1.0"
description = "Blok Transfer vakasi: ortak cekirdek + greedy ve MIP cozuculeri"
requires-python = ">=3.11"
# Kaynak bağlantısı ve temiz görünümler ortak pakette (vakalar/ortak/pyproject.toml).
# PuLP sabit: CBC ikilisi PuLP'la gelir (2.10.3); düğüm sınırında duran MIP planı sürüme
# bağlıdır, yayımlanan planlar bu sürümle çözüldü.
dependencies = ["perakende-analitik", "duckdb>=1.0", "pandas>=2.0", "pulp==3.3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["blok_transfer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["veri: gercek v4 verisi gerektirir (yavas)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
