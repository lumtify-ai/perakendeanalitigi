[project]
name = "kiriklik-vaka"
version = "0.1.0"
description = "Kiriklik transferi (tekleme) vakasi (v4): kirik beden setlerinin kalan bedenlerini sezon sonundan once toplamak, v4 motorunda ayni malla kol kiyasi"
requires-python = ">=3.11"
# Kaynak baglantisi ve temiz gorunumler ortak pakette (vakalar/ortak/pyproject.toml);
# kurulum: pip install -e ../ortak, sonra --no-deps -e ../../veri, ../allocation, ../kumeleme, ../markdown,
# sonra -e ".[dev]" (README).
# Kutuphane surumleri Ilk Sevkiyat ile ayni bantta (allocation/pyproject.toml): allocation ve
# kumeleme bu .venv'e --no-deps kurulur, hicbir surum degismemeli. lightgbm yalniz allocation'in
# ice aktarimi icin; pulp optimizasyon kollari icin (CBC, Blok Transfer ile ayni surum).
dependencies = ["perakende-analitik", "duckdb>=1.0", "pandas>=2.0", "numpy>=1.26",
                "scikit-learn>=1.3,<1.8", "lightgbm>=4.3,<4.6",
                "threadpoolctl>=3.1",   # kumeleme (profil kumeleri) sklearn bagimliligi
                "scipy>=1.10",          # sklearn bagimliligi; vaka kodu scipy ice aktarmaz
                "pulp>=3.0"]            # model.py (option basina tamsayili program)

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["kiriklik*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["veri: gercek v4 verisi gerektirir (yavas)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
