[project]
name = "rpt"
version = "0.1.0"
description = "Tekrar siparis (RPT) vakasi: sansurlu talep, yasam egrisi, aday modeli, miktar, dagitim"
requires-python = ">=3.11"
# lightgbm ust siniri replenishment vakasindaki Windows cokmesi yuzunden;
# scikit-learn <1.8: lightgbm 4.5 check_X_y(force_all_finite=...) cagiriyor.
# (bkz. vakalar/replenishment/pyproject.toml).
dependencies = ["duckdb>=1.0", "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.3,<1.8", "lightgbm>=4.3,<4.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rpt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["veri: gercek v3 verisi gerektirir (yavas)"]
# numpy 2.5 + pandas 2.3: Timedelta icinde "generic unit" uyarisi (bizim degil)
filterwarnings = ["ignore:.*generic.*unit:DeprecationWarning", "ignore:.*force_all_finite:FutureWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
