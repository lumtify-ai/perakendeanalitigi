[project]
name = "replenishment"
version = "0.1.0"
description = "Depodan magazaya replenishment vakasi (v4): kural tabanli, LightGBM ve Basit kollari"
requires-python = ">=3.11"
# lightgbm ust siniri Windows cokmesi yuzunden (lightgbm 4.7.0'in Windows
# tekerlegi Dataset.set_field icinde gecici bir numpy dizisini erken serbest
# birakiyor; egitimde "access violation"); 4.6 bandi dogrulanmadi.
# scikit-learn <1.8: lightgbm 4.5 check_X_y(force_all_finite=...) cagiriyor
# (bkz. vakalar/rpt/pyproject.toml).
# Kaynak baglantisi ve temiz gorunumler ortak pakette (vakalar/ortak/pyproject.toml);
# kurulum: pip install -e ../ortak, sonra --no-deps -e ../../veri, sonra -e ".[dev]" (README).
dependencies = ["perakende-analitik", "duckdb>=1.0", "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.3,<1.8", "lightgbm>=4.3,<4.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["replenishment*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["veri: gercek v4 verisi gerektirir (yavas)"]
# numpy 2.5 + pandas 2.3: Timedelta icinde "generic unit" uyarisi (bizim degil)
filterwarnings = ["ignore:.*generic.*unit:DeprecationWarning", "ignore:.*force_all_finite:FutureWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
