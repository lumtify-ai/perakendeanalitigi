[project]
name = "perakende-veri"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "yavas: tam olcekli, yavas testler (-m \"not yavas\" ile atlanir)",
    "veri: yayimlanan v4 verisini (cikti/v4) gerektirir; yavas ile birlikte",
]
