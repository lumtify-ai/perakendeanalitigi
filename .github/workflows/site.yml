name: site

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      # Workflow'un kendisini değiştiren bir PR kendini test etmeli;
      # aksi hâlde bozuk bir workflow yeşil görünerek main'e girer.
      - '.github/workflows/site.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Tek kaynak: site/.nvmrc. Cloudflare Pages de aynı dosyayı okur,
          # böylece CI ile dağıtım aynı Node sürümünde çalışır.
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
